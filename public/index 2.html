let AC=null,MG=null,MU=null,sOn=true,mTimer=null,mStep=0;
try{sOn=localStorage.getItem('sc_snd')!=='0'}catch(e){}
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=1;MG.connect(AC.destination);MU=AC.createGain();MU.gain.value=.05;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1400;MU.connect(lp);lp.connect(MG)}catch(e){AC=null}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tn(f,t0,d,ty,v,dst){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.type=ty||'sine';o.frequency.setValueAtTime(f,AC.currentTime+t0);g.gain.setValueAtTime(0,AC.currentTime+t0);g.gain.linearRampToValueAtTime(v,AC.currentTime+t0+.015);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+t0+d);o.connect(g);g.connect(dst||MG);o.start(AC.currentTime+t0);o.stop(AC.currentTime+t0+d+.05)}

 click:()=>tn(520,0,.07,'triangle',.08),

 build:()=>{tn(196,0,.12,'sawtooth',.06);tn(262,.1,.12,'sawtooth',.06);tn(392,.2,.25,'triangle',.09)},
 like:()=>{tn(660,0,.12,'sine',.1);tn(880,.09,.2,'sine',.1)},
 chest:()=>{[523,659,784,1047].forEach((f,i)=>tn(f,i*.09,.25,'triangle',.09))},
 win:()=>{[523,659,784,1047,1319].forEach((f,i)=>tn(f,i*.1,.3,'triangle',.1))},
 buy:()=>{tn(440,0,.1,'triangle',.08);tn(554,.1,.1,'triangle',.08);tn(659,.2,.25,'triangle',.1)},
 msg:()=>{tn(784,0,.1,'sine',.09);tn(1047,.11,.18,'sine',.09)},
 err:()=>{tn(200,0,.18,'sawtooth',.07);tn(150,.12,.22,'sawtooth',.07)}

MEL=[[784,0,659,0,784,880,784,0],[880,0,784,0,659,0,587,0],[880,0,1047,0,880,784,698,0],[784,0,659,0,587,0,659,784]];
function musicTick(){if(!sOn||!AC||document.hidden)return;const bar=(mStep>>3)%4,st=mStep&7,c=CHD[bar];
 if(st%2===0)tn(c[(st>>1)%3]*2,0,.5,'sine',.22,MU);
 if(st===0||st===4)tn(BAS[bar],0,.9,'triangle',.5,MU);
 const m=MEL[bar][st];if(m)tn(m,0,.8,'triangle',.4,MU);
 mStep++}

addEventListener('pointerdown',e=>{if(sOn){ac();musicStart()}},{passive:true});

[['collect','coin'],['serve','coin'],['claim','coin'],['help','coin'],['buyF','build'],['goldUp','build'],['openChest','chest'],['lvClaim','win'],['toggleLike','like'],['send','msg'],['join','win'],['buyPaid','buy'],['paid','buy'],['give','buy'],['sell','buy'],['buyBtn','msg']].forEach(([f,n])=>{const o=window[f];if(typeof o==='function')window[f]=function(){snd(n);return o.apply(this,arguments)}});
{const ot=window.toast;window.toast=function(t){if(/yetarli|limit|xato|noto|kutilayotgan|yopiq|bo‘lishi kerak|sotuvda emas/i.test(String(t)))snd('err');else if(/📨/.test(String(t)))snd('msg');return ot.apply(this,arguments)}}
