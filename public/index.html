<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sirli City</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#cfeaff;--card:#fff;--tx:#12263f;--mu:#5b7189;--pr:#1e88e5;--co:#ffc107;--bd:#d5e3f1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1b2c;--card:#18283d;--tx:#eaf2fb;--mu:#93a8bf;--bd:#2a4059}}
:root[data-theme="dark"]{--bg:#0e1b2c;--card:#18283d;--tx:#eaf2fb;--mu:#93a8bf;--bd:#2a4059}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,Roboto,sans-serif;padding-bottom:70px}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;font-weight:700}
.coin{background:var(--co);color:#4a3600;border-radius:20px;padding:4px 12px;font-weight:700}
main{padding:0 12px 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px}
h3{margin:0 0 8px}small,.mu{color:var(--mu)}
button{font:inherit;border:0;border-radius:12px;padding:11px 16px;background:var(--pr);color:#fff;font-weight:600;cursor:pointer}
button.y{background:var(--co);color:#4a3600}button.g{background:var(--bd);color:var(--tx)}button.r{background:#e53935}
button:disabled{opacity:.45}.big{width:100%;padding:16px;font-size:18px}
input{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);width:100%}
#tq{position:fixed;right:10px;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;flex-direction:column;gap:8px}#tq button{position:relative;width:44px;height:44px;border-radius:50%;padding:0;font-size:20px;background:#fffe;color:#12263f;box-shadow:0 2px 8px #0003}#tq button.on{outline:2px solid var(--pr)}#tq i{position:absolute;top:-4px;right:-4px;background:#e53935;color:#fff;border-radius:10px;font-size:11px;font-style:normal;padding:1px 5px}
nav{z-index:60;position:fixed;left:0;right:0;bottom:0;display:flex;overflow-x:auto;background:var(--card);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{position:relative;flex:0 0 auto;background:none;color:var(--mu);padding:6px 11px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button.on{color:var(--pr)}nav button.dot::after{content:'';position:absolute;top:3px;left:calc(50% + 8px);width:11px;height:11px;border-radius:50%;background:#ff3b30;border:2px solid var(--card)}#tq button.dot::after{content:'';position:absolute;top:0;right:0;width:12px;height:12px;border-radius:50%;background:#ff3b30;border:2px solid #fff}#splash{position:fixed;inset:0;z-index:99999;background:radial-gradient(circle at 50% 40%,#2a1f5c,#0b0b14);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s}#splash.h{opacity:0;pointer-events:none}#splash img{width:100%;height:auto;display:block}#splash .ld{width:60%;height:6px;border-radius:3px;background:#ffffff33;margin-top:22px;overflow:hidden}#splash .ld i{display:block;height:100%;width:0;background:#ffc107;animation:ldb 3s linear forwards}@keyframes ldb{to{width:100%}}#splash small{color:#ffffffb0;margin-top:10px}nav span{font-size:20px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:6px 0}
.vp{position:relative;height:62vh;min-height:340px;perspective:900px;overflow:hidden;touch-action:none;border-radius:12px;background:linear-gradient(#7cc4ff,#e6f5ff);user-select:none;-webkit-user-select:none}
.sc{position:absolute;left:50%;top:62%;transform-style:preserve-3d}
.gr{position:absolute;left:-228px;top:-228px;width:calc(100% + 456px);height:calc(100% + 456px);background-color:#74bd62;background-image:repeating-linear-gradient(90deg,#69758a 0 16px,transparent 16px 60px,#69758a 60px 76px),repeating-linear-gradient(0deg,#69758a 0 16px,transparent 16px 60px,#69758a 60px 76px),radial-gradient(circle,#a6e093,#5fae4f);transform:translateZ(-1px);border-radius:18px;box-shadow:0 0 0 8px #c9b48a,0 24px 40px rgba(0,0,0,.35)}
.bx{position:absolute;width:44px;height:44px;transform-style:preserve-3d;cursor:pointer}
.bx>div{position:absolute;background-color:var(--c);background-image:linear-gradient(rgba(0,0,0,var(--s)),rgba(0,0,0,var(--s))),repeating-linear-gradient(0deg,transparent 0 6px,rgba(255,255,255,.45) 6px 10px)}
.bx .t{inset:0;transform:translateZ(var(--h));background-image:linear-gradient(rgba(255,255,255,.3),rgba(255,255,255,.3));display:flex;align-items:center;justify-content:center;font:700 14px sans-serif;color:#fff}
.bx .fr,.bx .bk{width:44px;height:var(--h);transform-origin:top;transform:rotateX(90deg)}
.bx .fr{top:44px;--s:.12}.bx .bk{top:0;--s:.3}
.bx .rt,.bx .lf{width:var(--h);height:44px;transform-origin:left;transform:rotateY(-90deg);background-image:linear-gradient(rgba(0,0,0,var(--s)),rgba(0,0,0,var(--s))),repeating-linear-gradient(90deg,transparent 0 6px,rgba(255,255,255,.45) 6px 10px)}
.bx .rt{left:44px;--s:.3}.bx .lf{left:0;--s:.2}
.msg{padding:6px 0;border-bottom:1px solid var(--bd)}.msg b{color:var(--pr)}
#msgs{max-height:48vh;overflow-y:auto}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}.bar div{height:100%;background:var(--co)}
#toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#12263f;color:#fff;padding:8px 16px;border-radius:20px;opacity:0;transition:.3s;pointer-events:none;z-index:99}
.ctl{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px;z-index:5}.ctl button{padding:8px 12px;background:#fffd;color:#12263f}.sm .vp{height:240px;min-height:0}a{color:var(--pr)}.tag{background:var(--co);color:#4a3600;border-radius:8px;padding:1px 8px;font-size:12px;font-weight:700}
header{flex-wrap:wrap;gap:6px}
.bx>div{box-shadow:inset 0 0 0 1px rgba(255,255,255,.55)}
.bx>div::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.6),rgba(255,255,255,0) 45%,rgba(255,255,255,.28))}
.bx>.t::after{display:none}.gd>div::after{background:linear-gradient(135deg,rgba(255,255,255,.8),transparent 40%,rgba(255,235,140,.45) 75%,transparent)}
.lb{position:absolute;left:22px;top:22px;transform-origin:0 0;transform:translateZ(calc(var(--h) + 6px)) rotateZ(calc(var(--a)*-1deg)) rotateX(-58deg) translate(-50%,-100%);white-space:nowrap;background:#102a43d9;color:#fff;font:600 11px sans-serif;padding:2px 8px;border-radius:10px;pointer-events:none}
.tr,.mt,.sg{position:absolute;font-style:normal;line-height:1;transform-origin:0 0;transform:rotateZ(calc(var(--a)*-1deg)) rotateX(-58deg) translate(-50%,-100%);pointer-events:none}
.mt{clip-path:polygon(50% 0,100% 100%,0 100%);background:linear-gradient(#fff,#f2f6ff) top/100% 26% no-repeat,linear-gradient(105deg,#9fb4d3 50%,#6b82a8 50%)}
.sg{pointer-events:auto;background:#229ed9;color:#fff;text-decoration:none;font:700 15px sans-serif;padding:8px 14px;border-radius:12px;box-shadow:0 4px 0 #14719b;text-align:center}.sg small{display:block;font-weight:400;font-size:10px}
#map{position:relative;height:68vh;min-height:340px;margin:0 12px 10px;border-radius:14px;overflow:hidden;touch-action:none;background:linear-gradient(#4f9fee,#a9d6fb 45%,#f6e1d2 72%);display:none}#map canvas{display:block;width:100%;height:100%}
.pk{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;margin-bottom:10px;text-decoration:none;color:var(--tx);box-shadow:0 3px 0 var(--bd)}.pk .ic{font-size:34px}.pk .pi{flex:1}.pk .pp{text-align:right}.pk i{font-style:normal;background:#e53935;color:#fff;border-radius:8px;padding:1px 7px;font-size:12px;font-weight:700;margin-right:6px}.pk s{color:var(--mu);font-size:13px}
#live{display:none;margin:0 12px 8px;background:var(--card);border-radius:20px;padding:6px 12px;font-size:13px;align-items:center;gap:8px}.jn{background:#e53935;color:#fff;border-radius:8px;padding:0 7px;font-weight:700;font-size:11px}
.cd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;padding:12px;border:2px solid var(--bd);border-radius:12px}.cd.on{border-color:var(--pr);background:rgba(30,136,229,.08)}.num{font:700 17px ui-monospace,monospace;letter-spacing:1px}
.st{font-size:12px;font-weight:700;border-radius:8px;padding:2px 8px;color:#fff}.st.p{background:#f59e0b}.st.a{background:#16a34a}.st.r{background:#e53935}
.gs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.gs>div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;font-size:13px}.gs b{display:block;font-size:19px}
.anav{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}.anav button{flex:0 0 auto;padding:8px 12px;background:var(--bd);color:var(--tx);font-size:13px}.anav button.on{background:var(--pr);color:#fff}
#map.half{height:40vh;min-height:230px;pointer-events:none;touch-action:auto}#map.half .ctl{display:none}#map.fs{position:fixed;inset:0;margin:0;border-radius:0;height:100dvh;min-height:0;z-index:50}#fsc{position:absolute;left:8px;right:8px;bottom:8px;max-height:46%;overflow:auto;z-index:6}
.sw{display:flex;gap:8px;flex-wrap:wrap}.sw i{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--bd);cursor:pointer}
.tgb{background:#229ed9;color:#fff;border-radius:12px;padding:11px 16px;font-weight:600;text-decoration:none}
#fst{display:none;position:absolute;left:8px;right:8px;top:calc(env(safe-area-inset-top,0px) + 8px);align-items:center;justify-content:space-between;gap:8px;z-index:7}
#map.fs #fst{display:flex}#map.fs .ctl{top:calc(env(safe-area-inset-top,0px) + 64px)}
.fsx{background:#fffe;color:#12263f;padding:9px 14px}
#fsc .cd{margin-top:8px}
#map.fs{height:auto;bottom:calc(66px + env(safe-area-inset-bottom,0px))}
#map .ctl,#map.fs .ctl{top:auto;left:auto;right:12px;bottom:28%;z-index:7}#map .ctl button{width:54px;height:54px;padding:0;font-size:28px;border-radius:50%;box-shadow:0 2px 10px #0005}#map.hc .ctl,#map.fs.hc .ctl{bottom:50%}
#tourov{position:fixed;inset:0;z-index:90}#tourx{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);right:10px;opacity:.3;width:38px;height:38px;border-radius:50%;border:0;background:#000a;color:#fff;font-size:18px}#tourc{position:absolute;left:0;right:0;bottom:calc(46px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none}.tc{background:linear-gradient(#1f4fa3ee,#0b1f4aee);border:3px solid #ffffffd0;border-radius:26px;padding:14px 28px;text-align:center;color:#fff;box-shadow:0 8px 30px #0008;min-width:250px;max-width:92vw;animation:tpop .6s both}.tr{font-size:58px;line-height:1.05}.tn{font-size:30px;font-weight:900}.tb{font-size:23px;font-weight:800;margin-top:4px;color:#ffd23f;overflow-wrap:anywhere}.ts{font-size:15px;opacity:.92;margin-top:5px}@keyframes tpop{0%{transform:translateY(70px) scale(.7);opacity:0}70%{transform:translateY(-6px) scale(1.05)}100%{transform:none;opacity:1}}body.tour header,body.tour #nav,body.tour #fst,body.tour #fsc,body.tour #map .ctl,body.tour #tq{display:none!important}body.tour #map.fs{bottom:0}
</style>
